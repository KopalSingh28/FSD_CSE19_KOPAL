<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
            margin-bottom: 30px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        #addBtn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #addBtn:hover {
            background-color: #1d4ed8;
        }

        .search {
            margin-top: 25px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .stat {
            width: 50%;
            padding: 15px;
            border: 1px solid #999;
            border-radius: 5px;
            background-color: #f9fafb;
            font-weight: bold;
        }

        .stat span {
            float: right;
            color: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #eef2ff;
        }

        .edit {
            background-color: orange;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete {
            background-color: red;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .grade {
            margin-top: 30px;
            border-top: 2px solid #ccc;
            padding-top: 20px;
        }

        .grade h2 {
            text-decoration: underline;
        }

        .grade li {
            margin: 8px 0;
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .stats {
                flex-direction: column;
            }

            .stat {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <!-- Student Form -->
    <form id="studentForm">

        <div class="form">

            <div>
                <label>Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <div>
                <label>Roll No.</label>
                <input
                    type="text"
                    id="roll"
                    placeholder="Enter roll number"
                    required
                >
            </div>

            <div>
                <label>Course</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech CSE</option>
                    <option>B.Tech IT</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>B.Tech AI/ML</option>
                </select>
            </div>

            <div>
                <label>Marks</label>

                <input
                    type="number"
                    id="marks"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >
            </div>

            <div class="full">
                <button id="addBtn" type="submit">
                    Add Student
                </button>
            </div>

        </div>

    </form>


    <!-- Search -->
    <div class="search">

        <label>Search by Name or Roll No.</label>

        <input
            type="text"
            id="search"
            placeholder="Search student..."
        >

    </div>


    <!-- Statistics -->
    <div class="stats">

        <div class="stat">
            Total Students:
            <span id="total">0</span>
        </div>

        <div class="stat">
            Average Marks:
            <span id="average">0</span>
        </div>

    </div>


    <!-- Student Table -->
    <table>

        <thead>

            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>


    <!-- Grade System -->
    <div class="grade">

        <h2>Grade</h2>

        <ul>
            <li>90 >= A+</li>
            <li>85 >= A</li>
            <li>80 >= B+</li>
            <li>70 >= B</li>
            <li>60 >= C+</li>
            <li>50 >= C</li>
            <li>Below 50 = F</li>
        </ul>

    </div>

    </div>

    <script>
    // JavaScript code here
    

    let students = [];

    const form = document.getElementById("studentForm");
    const table = document.getElementById("studentTable");
    const search = document.getElementById("search");

    const total = document.getElementById("total");
    const average = document.getElementById("average");


    // Function to calculate grade
    function getGrade(marks) {

        if (marks >= 90) {
            return "A+";
        }
        else if (marks >= 85) {
            return "A";
        }
        else if (marks >= 80) {
            return "B+";
        }
        else if (marks >= 70) {
            return "B";
        }
        else if (marks >= 60) {
            return "C+";
        }
        else if (marks >= 50) {
            return "C";
        }
        else {
            return "F";
        }

    }


    // Add Student
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const roll = document.getElementById("roll").value;
        const course = document.getElementById("course").value;
        const marks = Number(document.getElementById("marks").value);


        const student = {
            name: name,
            roll: roll,
            course: course,
            marks: marks
        };


        students.push(student);

        displayStudents(students);

        updateStats();

        form.reset();

    });


    // Display students in table
    function displayStudents(studentList) {

        table.innerHTML = "";

        studentList.forEach(function(student, index) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.roll}</td>
                <td>${student.name}</td>
                <td>${student.course}</td>
                <td>${student.marks}</td>
                <td>${getGrade(student.marks)}</td>

                <td>
                    <button class="edit" onclick="editStudent(${index})">
                        Edit
                    </button>

                    <button class="delete" onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);

        });

    }


    // Search student
    search.addEventListener("input", function() {

        const searchValue = search.value.toLowerCase();

        const filteredStudents = students.filter(function(student) {

            return (
                student.name.toLowerCase().includes(searchValue) ||
                student.roll.toLowerCase().includes(searchValue)
            );

        });


        displayStudents(filteredStudents);

    });


    // Update statistics
    function updateStats() {

        total.textContent = students.length;


        if (students.length === 0) {

            average.textContent = "0";
            return;

        }


        let sum = 0;

        students.forEach(function(student) {

            sum += student.marks;

        });


        const avg = sum / students.length;

        average.textContent = avg.toFixed(2);

    }


    // Delete student
    function deleteStudent(index) {

        students.splice(index, 1);

        displayStudents(students);

        updateStats();

    }


    // Edit student
    function editStudent(index) {

        const student = students[index];


        document.getElementById("name").value = student.name;

        document.getElementById("roll").value = student.roll;

        document.getElementById("course").value = student.course;

        document.getElementById("marks").value = student.marks;


        students.splice(index, 1);

        displayStudents(students);

        updateStats();

    }


    </script>

    </body>
    </html>
